<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <title>WireQuill</title>
  <!-- A wire, carrying traffic. -->
  <circle cx="3" cy="16.5" r="1.6" fill="currentColor" />
  <path d="M4.6 16.5H10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
  <!-- The same line, lifting into a stroke of ink. -->
  <path
    d="M10 16.5C14.2 16.5 16.6 12.4 18.4 7.2"
    stroke="currentColor"
    stroke-width="2.4"
    stroke-linecap="round"
  />
  <!-- The nib it ends in. -->
  <path d="M17.5 8.6 22.2 2l-1.6 8.1z" fill="currentColor" />
</svg>
