name: Release

# Publishing happens only when somebody asks for it, never on a push. Two ways
# to ask: publishing a GitHub Release, or running this workflow by hand and
# typing the version as confirmation.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, exactly as in package.json (for example 0.1.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest

    permissions:
      # Least privilege. `id-token: write` is what npm Trusted Publishing needs
      # in order to mint a short-lived credential; nothing here writes to the
      # repository, and there is no long-lived npm token anywhere in this file.
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm before Node, and never `corepack enable` — see the note in ci.yml.
      # A corepack shim created against the runner's preinstalled Node keeps
      # pnpm on that Node, which on Windows survives `setup-node` entirely.
      # Publishing runs on Ubuntu, but the ordering rule is the same everywhere
      # and a workflow that only works on one runner is a trap for the next
      # person who changes it.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Versions
        run: |
          node --version
          pnpm --version

      # Trusted Publishing needs a recent npm. Failing here with a sentence is
      # better than failing at `npm publish` with an authentication error.
      - name: Check npm supports trusted publishing
        run: node scripts/check-npm-version.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      # The published version has to be the version somebody asked for, whether
      # that came from a tag or from the dispatch input.
      - name: Check the version matches
        run: node scripts/check-release-version.mjs
        env:
          RELEASE_REF: ${{ github.event.release.tag_name }}
          RELEASE_INPUT: ${{ inputs.version }}

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      # The real artifact, installed into a throwaway project and run. If this
      # fails, the thing about to be published does not work.
      - name: Package install smoke
        run: node scripts/package-smoke.mjs

      # No NODE_AUTH_TOKEN, no NPM_TOKEN. Authentication comes from the OIDC
      # identity above, which npm exchanges for a short-lived credential once
      # this workflow is registered as the package's trusted publisher.
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: packages/wirequill
